project_id = "matrix-memory"

[functions.memory-write]
verify_jwt = true

[functions.memory-recall]
verify_jwt = true

# Llamadas internas desde pg_net. Ambos workers validan además
# x-matrix-worker-secret contra el secreto almacenado en Vault.
[functions.matrix-embedding-worker]
verify_jwt = false

[functions.matrix-query-embedding-worker]
verify_jwt = false

# OAuth signature/session/owner validation is implemented inside matrix-mcp.
[functions.matrix-mcp]
verify_jwt = false
entrypoint = "./functions/matrix-mcp/index.ts"
import_map = "./functions/matrix-mcp/deno.json"

# Synthetic data is opt-in in the study profile, never seeded in production.
[db.seed]
enabled = false
